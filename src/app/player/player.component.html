<div class="h-screen flex flex-col justify-center items-center p-4">
  <h2 class="text-xl font-semibold mb-6 text-center">{{ question }}</h2>

  <div class="grid grid-cols-1 gap-4 w-full max-w-sm">
    @for (answer of answers; track answer) {
      <button class="bg-purple-500 text-white p-4 rounded text-lg">
        {{ answer }}
      </button>
    }
  </div>
</div>
