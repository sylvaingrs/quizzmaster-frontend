<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">🎤 Quiz Master</h1>

  <div class="bg-white shadow rounded p-4">
    <h2 class="text-xl mb-4">{{ question }}</h2>

    <div class="grid grid-cols-2 gap-4">
      @for (answer of answers; track answer) {
        <button class="bg-blue-500 text-white p-3 rounded hover:bg-blue-600">
          {{ answer }}
        </button>
      }
    </div>
  </div>

  <div class="mt-6 flex gap-4">
    <button class="bg-green-500 text-white px-4 py-2 rounded">Lancer la question</button>
    <button class="bg-red-500 text-white px-4 py-2 rounded">Stop</button>
  </div>
</div>
